[package]
name = "omniroute-desktop"
version = "3.8.49"
description = "OmniRoute Desktop Application (Tauri)"
authors = ["OmniRoute Team <support@omniroute.online>"]
license = "MIT"
homepage = "https://omniroute.online"
repository = "https://github.com/diegosouzapw/OmniRoute"
edition = "2021"
rust-version = "1.77"

# See: https://doc.rust-lang.org/cargo/reference/manifest.html#the-default-run-field
[lib]
name = "omniroute_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"

# Async + logging
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

# Crypto for secret bootstrap (matches crypto.randomBytes in main.js)
rand = "0.8"
hex = "0.4"

# HTTP + URL parsing (for waitForServer health probe)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

# Misc
dirs = "5"
anyhow = "1"
thiserror = "1"
once_cell = "1"

# macOS / Linux / Windows process-tree kill
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[features]
# By default Tauri builds in release mode for `tauri build`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"     # Smaller binary (Tauri recommendation)
lto = true
codegen-units = 1
panic = "abort"
strip = true
