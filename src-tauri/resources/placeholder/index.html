<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniRoute</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .root {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 24px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background: linear-gradient(135deg, #ff586b 0%, #ff8a5b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 700;
        color: #fff;
        box-shadow: 0 8px 32px rgba(255, 88, 107, 0.35);
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #737373;
        max-width: 360px;
        text-align: center;
        line-height: 1.5;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid #262626;
        border-top-color: #ff586b;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .error {
        color: #f87171;
        font-size: 12px;
        max-width: 360px;
        text-align: center;
        line-height: 1.5;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="root">
      <div class="logo">O</div>
      <h1>Starting OmniRoute…</h1>
      <div class="spinner"></div>
      <p id="status">Booting the embedded server. This usually takes a few seconds; the first launch may take longer while database migrations run.</p>
      <p class="error" id="error"></p>
    </div>
    <script>
      // The Rust main process emits `server-status` events on the `main` window.
      // While the window is still pointing at this placeholder document, we
      // surface those events so the user sees live progress instead of a frozen
      // spinner.
      (async function () {
        const errorEl = document.getElementById("error");
        const statusEl = document.getElementById("status");
        try {
          const { listen } = await window.__TAURI__.event;
          await listen("server-status", (event) => {
            const payload = event.payload || {};
            const status = payload.status;
            const port = payload.port;
            const remoteUrl = payload.remoteUrl;
            if (status === "starting") {
              statusEl.textContent = remoteUrl
                ? `Connecting to remote server at ${remoteUrl}…`
                : `Starting embedded server on port ${port}…`;
            } else if (status === "restarting") {
              statusEl.textContent = `Restarting server on port ${port}…`;
            } else if (status === "running") {
              statusEl.textContent = remoteUrl
                ? `Connected to ${remoteUrl}.`
                : `Server ready on port ${port}. Loading dashboard…`;
            } else if (status === "stopped") {
              statusEl.textContent = "Server stopped.";
            } else if (status === "error") {
              errorEl.style.display = "block";
              errorEl.textContent =
                "The embedded server failed to start. Check the logs and restart OmniRoute.";
            }
          });
        } catch (err) {
          // __TAURI__ not yet available — the placeholder will be replaced by
          // the real Next.js page as soon as the server is ready.
        }
      })();
    </script>
  </body>
</html>
