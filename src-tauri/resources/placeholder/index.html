<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniRoute</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .root {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 24px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background: linear-gradient(135deg, #ff586b 0%, #ff8a5b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 700;
        color: #fff;
        box-shadow: 0 8px 32px rgba(255, 88, 107, 0.35);
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #737373;
        max-width: 360px;
        text-align: center;
        line-height: 1.5;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid #262626;
        border-top-color: #ff586b;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .error {
        color: #f87171;
        font-size: 12px;
        max-width: 360px;
        text-align: center;
        line-height: 1.5;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="root">
      <div class="logo">O</div>
      <h1>Starting OmniRoute…</h1>
      <div class="spinner"></div>
      <p id="status">Booting the embedded server. This usually takes a few seconds; the first launch may take longer while database migrations run.</p>
      <p class="error" id="error"></p>
    </div>
    <!-- No JavaScript — the Rust main process navigates this window to the
         server URL via eval() once the server is ready. Keeping this page
         JS-free avoids any WebView2-before-ready crashes. -->
  </body>
</html>
