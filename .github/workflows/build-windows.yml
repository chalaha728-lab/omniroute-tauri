name: Build Windows

# Builds the OmniRoute Tauri desktop shell for Windows on every push to main
# and on manual dispatch. Uploads the NSIS installer + portable .exe as a
# workflow artifact (downloadable from the Actions run page) and (on tag
# pushes) attaches them to a GitHub Release.
#
# The build is self-contained: it does NOT depend on the OmniRoute Next.js
# source. The Tauri window loads `resources/placeholder/index.html` (a small
# loading screen) and, at runtime, spawns the bundled Next.js standalone
# server from `<resources>/app/server-ws.mjs` if present. When that path is
# absent (as in this minimal build), the window just shows the placeholder —
# which is enough to verify the Tauri shell runs natively on Windows.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed by softprops/action-gh-release to upload release assets

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app (release)
        run: npm run tauri:build

      - name: List bundle output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName, Length

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniRoute-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI artifact (if any)
        uses: actions/upload-artifact@v4
        with:
          name: OmniRoute-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
