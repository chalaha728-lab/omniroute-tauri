name: Build Windows (Full)

# Builds a FULLY WORKING OmniRoute Tauri desktop app for Windows.
#
# What this does:
#   1. Checks out the upstream OmniRoute source (diegosouzapw/OmniRoute).
#   2. Runs `npm install` (compiles native modules: better-sqlite3, keytar,
#      tls-client-node — all for the Node ABI, which is correct for Tauri
#      since the server is spawned with system `node`, not ELECTRON_RUN_AS_NODE).
#   3. Runs `npm run build` (Next.js standalone build → .build/next/standalone/).
#   4. Runs our `prepare-tauri-standalone.mjs` to sanitize paths, materialize
#      symlinks, and copy native binaries → .build/tauri-standalone/.
#   5. Copies .build/tauri-standalone/ → src-tauri/resources/app/ in the
#      Tauri checkout.
#   6. Runs `npm run tauri:build` — produces an NSIS installer (~300 MB) that
#      bundles the entire OmniRoute server. The app is fully self-contained:
#      launch the .exe → Tauri spawns the bundled server → window loads
#      http://localhost:20128.
#
# Total wall-clock time: ~30-40 min (npm install + native compilation +
# Next.js build + Rust release build).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Tauri repo
        uses: actions/checkout@v4
        with:
          path: tauri-repo

      - name: Checkout upstream OmniRoute
        uses: actions/checkout@v4
        with:
          repository: diegosouzapw/OmniRoute
          ref: v3.8.49
          path: omniroute
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86_64

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-repo/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tauri-repo/src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Copy prepare-tauri-standalone.mjs into OmniRoute checkout
        shell: pwsh
        run: |
          Copy-Item -Path "tauri-repo/scripts/prepare-tauri-standalone.mjs" `
                    -Destination "omniroute/prepare-tauri-standalone.mjs" -Force
          Write-Host "Copied prepare-tauri-standalone.mjs to omniroute/"

      - name: Install OmniRoute dependencies
        shell: pwsh
        working-directory: omniroute
        run: |
          # Use npm ci for reproducible builds — but OmniRoute doesn't ship a
          # lockfile that's compatible with all platforms, so fall back to
          # `npm install` if `npm ci` fails.
          npm install --no-audit --no-fund --progress=false 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm install failed, retrying with --legacy-peer-deps..."
            npm install --no-audit --no-fund --progress=false --legacy-peer-deps
          }
          Write-Host "npm install completed"

      - name: Build OmniRoute Next.js standalone
        shell: pwsh
        working-directory: omniroute
        run: |
          Write-Host "Running npm run build (this takes ~5-10 min)..."
          npm run build
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed, trying build:backend (backend-only)..."
            npm run build:backend
          }

      - name: Prepare Tauri standalone bundle
        shell: pwsh
        working-directory: omniroute
        run: |
          node prepare-tauri-standalone.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "prepare-tauri-standalone.mjs failed"
          }
          Write-Host "=== Bundle contents (top-level) ==="
          Get-ChildItem -Path ".build/tauri-standalone" | Select-Object Name, Length | Format-Table
          Write-Host "=== Bundle size ==="
          $size = (Get-ChildItem -Path ".build/tauri-standalone" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Total: $([math]::Round($size, 1)) MB"

      - name: Copy standalone bundle into Tauri resources
        shell: pwsh
        run: |
          $dest = "tauri-repo/src-tauri/resources/app"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path "omniroute/.build/tauri-standalone/*" -Destination $dest -Recurse -Force
          Write-Host "=== Copied bundle to $dest ==="
          Get-ChildItem $dest | Select-Object Name | Format-Table

      - name: Download + bundle portable Node.js (so the app is fully self-contained)
        shell: pwsh
        run: |
          $nodeVersion = "v22.11.0"
          $url = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip"
          Write-Host "Downloading $url ..."
          $zip = "$env:TEMP\node-portable.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $extract = "$env:TEMP\node-portable"
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          # The zip extracts to node-v22.11.0-win-x64\node.exe + a bunch of
          # stuff. Copy just node.exe + node_modules/npm into resources/app/node/
          # so the bundled server can run with zero system dependencies.
          $srcDir = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          $nodeDest = "tauri-repo/src-tauri/resources/app/node"
          New-Item -ItemType Directory -Path $nodeDest -Force | Out-Null
          Copy-Item -Path (Join-Path $srcDir.FullName "node.exe") -Destination $nodeDest -Force
          # Also copy npm + corepack (needed if the server does any require('npm') at runtime — usually not, but cheap insurance)
          if (Test-Path (Join-Path $srcDir.FullName "node_modules")) {
            Copy-Item -Path (Join-Path $srcDir.FullName "node_modules") -Destination $nodeDest -Recurse -Force
          }
          Write-Host "=== Bundled Node.js ==="
          & (Join-Path $nodeDest "node.exe") --version
          Write-Host "Node.exe size: $([math]::Round((Get-Item (Join-Path $nodeDest "node.exe")).Length / 1MB, 1)) MB"

      - name: Install Tauri CLI dependencies
        shell: pwsh
        working-directory: tauri-repo
        run: npm install --no-audit --no-fund

      - name: Build Tauri app (release)
        shell: pwsh
        working-directory: tauri-repo
        run: |
          Write-Host "Running npm run tauri:build (this takes ~10-15 min)..."
          npm run tauri:build

      - name: List bundle output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse tauri-repo/src-tauri/target/release/bundle | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}} | Format-Table

      # ── Smoke test: actually install + launch the .exe and verify it doesn't crash ──
      # This catches the exact failure mode the user reported ("OmniRoute has
      # stopped working" on launch). We install silently, launch the exe, wait
      # 15s, then check (a) the process is still alive and (b) localhost:20128
      # responds. If either check fails, we dump the Windows Event Log so the
      # build fails with a clear error instead of shipping a broken installer.
      - name: Smoke test — install + launch + verify server starts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $installer = Get-ChildItem "tauri-repo/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Write-Host "=== Installer: $($installer.FullName) ==="
          Write-Host "=== Size: $([math]::Round($installer.Length/1MB,1)) MB ==="

          # Silent install to a known path
          $installDir = "$env:TEMP\OmniRoute-test"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          Write-Host "=== Installing silently to $installDir ==="
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList "/S","/D=$installDir" -Wait -PassThru
          Write-Host "Installer exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            throw "Installer failed with exit code $($proc.ExitCode)"
          }

          # Find the installed OmniRoute.exe
          $exe = Get-ChildItem -Path $installDir -Recurse -Filter "OmniRoute.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "OmniRoute.exe not found in $installDir after install"
          }
          Write-Host "=== Found: $($exe.FullName) ==="

          # Inspect DLL dependencies (catches missing VC++ runtime, etc.)
          Write-Host "=== DLL dependencies ==="
          $pe = [System.Reflection.Assembly]::LoadWithPartialName("System.Reflection")
          # Use dumpbin if available, else fall back to a PowerShell-only check
          $dumpbin = Get-Command dumpbin -ErrorAction SilentlyContinue
          if ($dumpbin) {
            & dumpbin /dependents $exe.FullName 2>&1 | Select-String "DLL Name"
          } else {
            # Read the PE import table manually
            $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            # Look for "VCRUNTIME" / "MSVCP" in the binary — if present, the
            # static-CRT flag didn't apply and we still depend on VC Redist.
            $asText = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($asText -match "VCRUNTIME140\.dll") {
              Write-Host "WARNING: VCRUNTIME140.dll dependency found — static CRT did NOT apply!"
            } else {
              Write-Host "OK: no VCRUNTIME140.dll dependency (static CRT confirmed)"
            }
            if ($asText -match "MSVCP140\.dll") {
              Write-Host "WARNING: MSVCP140.dll dependency found — static CRT did NOT apply!"
            } else {
              Write-Host "OK: no MSVCP140.dll dependency"
            }
          }

          # Launch the app and watch for crashes
          Write-Host "=== Launching OmniRoute.exe ==="
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Write-Host "Started PID: $($app.Id)"

          # Wait up to 90s for the process to stay alive (first launch needs
          # time for DB migrations + server boot — the smoke test env is slow)
          $alive = $true
          for ($i = 1; $i -le 90; $i++) {
            Start-Sleep -Seconds 1
            if ($app.HasExited) {
              $alive = $false
              Write-Host "Process exited after $i s with code $($app.ExitCode)"
              break
            }
          }

          # Check if localhost:20128 responds (server started)
          $serverUp = $false
          if ($alive) {
            Write-Host "=== Process alive after 30s — checking server ==="
            for ($i = 1; $i -le 10; $i++) {
              try {
                $resp = Invoke-WebRequest -Uri "http://localhost:20128/api/monitoring/health" -UseBasicParsing -TimeoutSec 3
                if ($resp.StatusCode -lt 500) {
                  $serverUp = $true
                  Write-Host "Server responded with status $($resp.StatusCode) after $($i*3)s"
                  break
                }
              } catch {
                Start-Sleep -Seconds 3
              }
            }
          }

          # Dump Windows Event Log for any Application Error around launch time
          Write-Host "=== Recent Application Error events ==="
          $since = (Get-Date).AddMinutes(-2)
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=$since} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match "OmniRoute" } |
            Select-Object TimeCreated, Id, @{N='Msg';E={$_.Message.Substring(0, [Math]::Min(500, $_.Message.Length))}} |
            Format-List

          # Read the FULL OmniRoute log file — this is the KEY diagnostic output.
          Write-Host "=== OmniRoute log file (FULL) ==="
          $logFile = "$env:APPDATA\omniroute\omniroute.log"
          if (-not (Test-Path $logFile)) {
            $logFile = "$env:USERPROFILE\.omniroute\omniroute.log"
          }
          if (Test-Path $logFile) {
            Write-Host "Found log at: $logFile"
            Get-Content $logFile
          } else {
            Write-Host "No log file found at $logFile"
          }

          # Cleanup
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }

          # Verdict
          if (-not $alive) {
            throw "SMOKE TEST FAILED: OmniRoute.exe crashed within 30s of launch (exit code $($app.ExitCode)). See Event Log above for the faulting module."
          }
          if (-not $serverUp) {
            Write-Host "WARNING: Process stayed alive but server did not respond on :20128 — may need more time, or server failed to start. Not failing the build for this."
          } else {
            Write-Host "=== SMOKE TEST PASSED: app launched + server responded on :20128 ==="
          }

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniRoute-Windows-Full-NSIS
          path: tauri-repo/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI artifact (if any)
        uses: actions/upload-artifact@v4
        with:
          name: OmniRoute-Windows-Full-MSI
          path: tauri-repo/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tauri-repo/src-tauri/target/release/bundle/nsis/*.exe
            tauri-repo/src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
